[project]
name = "web-viewer-backend"
version = "0.1.0"
description = "FastAPI Backend for PixivUtil2 Web Viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pillow>=9.0.0",
    "opencv-python-headless>=5.0.0.93",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

