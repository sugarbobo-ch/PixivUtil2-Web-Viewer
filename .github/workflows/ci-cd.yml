name: CI and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Windows integration characterization
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync backend dependencies
        run: uv sync --locked --python 3.12

      - name: Run Windows picker, media, and recycle-bin coverage
        run: >-
          uv run python -m unittest
          tests.test_path_picker
          tests.test_main_http_routes
          tests.test_media_library.MediaLibraryTests.test_hidden_artist_and_recycle_metadata_are_reversible
          tests.test_media_library.MediaLibraryTests.test_thumbnail_cache_recovery_details_and_recycle_bin_move

  frontend:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Windows release frontend build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - backend
      - frontend
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $archiveRoot = "PixivUtil2-Web-Viewer-$env:RELEASE_TAG"
          $asset = "$archiveRoot.zip"
          git archive --format=zip --prefix="$archiveRoot/" --output=$asset HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $asset = "PixivUtil2-Web-Viewer-$env:RELEASE_TAG.zip"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset --clobber
          } else {
            gh release create $env:RELEASE_TAG $asset --verify-tag --generate-notes --title $env:RELEASE_TAG
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
